    /* Animaciones suaves y utilidades táctiles */
    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-enter {
      animation: fadeSlideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .chip-selected {
      ring: 3px;
      transform: scale(1.04);
      box-shadow: 0 10px 15px -3px rgba(56, 189, 248, 0.35);
    }
    .drop-target-active {
      border-color: #38bdf8 !important;
      background-color: #e0f2fe !important;
    }

      user-select: none;

  <!-- Contenedor Principal Panorámico (ocupa todo el espacio vertical sin dejar huecos) -->

  <!-- Pie de página con Créditos y Licencia Creative Commons -->
  <footer class="shrink-0 bg-slate-950/85 backdrop-blur-md border-t border-cyan-500/25 py-2 px-4">

      <div class="flex items-center gap-2">

        <span class="hidden sm:inline text-cyan-400/60">•</span>

      <div class="flex items-center gap-2.5">
        <!-- Botón Créditos -->
        <button onclick="openModal('credits')" class="px-3 py-1.5 rounded-lg bg-blue-900/70 hover:bg-blue-800 border border-cyan-400/35 text-cyan-100 font-bold text-xs flex items-center gap-1.5 transition-all shadow-xs">

        <!-- Botón Creative Commons -->

  <!-- Modal para Créditos y Creative Commons -->
  <div id="info-modal" onclick="if(event.target===this) closeModal()" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-950/75 backdrop-blur-sm p-4">
    <div id="info-modal-content" class="blue-glass text-white max-w-lg w-full rounded-3xl p-6 border border-cyan-400/40 shadow-2xl animate-enter">
      <!-- Contenido dinámico del modal -->
    </div>
  </div>

  <!-- Lógica de la Aplicación -->
  <script>
    // =========================================================================
    // SISTEMA DE EFECTOS DE SONIDO SINTETIZADOS CON TONE.JS / WEB AUDIO
    // =========================================================================
    const soundEngine = {
      enabled: true,
      initialized: false,
      synth: null,
      async ensureReady() {
        if (!this.enabled) return false;
        try {
          if (window.Tone && Tone.context.state !== 'running') {
            await Tone.start();
          }
          if (window.Tone && !this.synth) {
            this.synth = new Tone.PolySynth(Tone.Synth, {
              oscillator: { type: "triangle" },
              envelope: { attack: 0.01, decay: 0.14, sustain: 0.08, release: 0.25 }
            }).toDestination();
            this.synth.volume.value = -8;
          }
          this.initialized = true;
          return true;
        } catch (e) {
          return false;
        }
      },
      async playClick() {
        if (!this.enabled) return;
        const ok = await this.ensureReady();
        if (ok && this.synth) {
          this.synth.triggerAttackRelease("C5", "32n");
        }
      },
      async playSuccess() {
        if (!this.enabled) return;
        const ok = await this.ensureReady();
        if (ok && this.synth) {
          const now = Tone.now();
          this.synth.triggerAttackRelease("C5", "16n", now);
          this.synth.triggerAttackRelease("E5", "16n", now + 0.08);
          this.synth.triggerAttackRelease("G5", "16n", now + 0.16);
          this.synth.triggerAttackRelease("C6", "8n", now + 0.24);
        }
      },
      async playError() {
        if (!this.enabled) return;
        const ok = await this.ensureReady();
        if (ok && this.synth) {
          const now = Tone.now();
          this.synth.triggerAttackRelease("E3", "16n", now);
          this.synth.triggerAttackRelease("Bb2", "8n", now + 0.12);
        }
      }
    };

    function toggleSound() {
      soundEngine.enabled = !soundEngine.enabled;
      const icon = document.getElementById("icon-sound");
      if (icon) {
        icon.setAttribute("data-lucide", soundEngine.enabled ? "volume-2" : "volume-x");
        if (window.lucide) lucide.createIcons();
      }
      if (soundEngine.enabled) {
        soundEngine.playClick();
      }
    }

    // Listener global para sonido al presionar botones interactivos
    document.addEventListener("click", (e) => {
      const btn = e.target.closest("button");
      if (btn && !btn.disabled && btn.id !== "btn-sound-toggle") {
        soundEngine.playClick();
      }
    }, true);

    // =========================================================================
    // MODALES DE CRÉDITOS Y CREATIVE COMMONS
    // =========================================================================
    function openModal(type) {
      const modal = document.getElementById("info-modal");
      const content = document.getElementById("info-modal-content");
      if (!modal || !content) return;

      if (type === "credits") {
        content.innerHTML = `
          <div class="flex items-center justify-between pb-3 mb-4 border-b border-cyan-400/25">
            <div class="flex items-center gap-2.5">
              <div class="w-9 h-9 rounded-xl bg-cyan-500/20 border border-cyan-400/40 flex items-center justify-center text-cyan-300">
                <i data-lucide="users" class="w-5 h-5"></i>
              </div>
              <h3 class="text-lg font-extrabold text-white">Créditos del Recurso</h3>
            </div>
            <button onclick="closeModal()" class="p-1.5 rounded-lg bg-slate-800/80 hover:bg-slate-700 text-cyan-200">
              <i data-lucide="x" class="w-4 h-4"></i>
            </button>
          </div>
          <div class="space-y-4 text-sm">
            <div class="p-3.5 rounded-2xl bg-slate-900/70 border border-cyan-400/25">
              <span class="text-[11px] font-extrabold uppercase tracking-wider text-cyan-300 block mb-1">Expertos temáticos</span>
              <p class="font-bold text-white text-base">Maria Alejandra Camacho Villa</p>
              <p class="font-bold text-white text-base">Adrián de la Rosa</p>
            </div>
            <div class="p-3.5 rounded-2xl bg-slate-900/70 border border-cyan-400/25">

              <p class="font-bold text-white text-base">William Alarcón G.</p>
            </div>
          </div>
          <div class="mt-5 flex justify-end">
            <button onclick="closeModal()" class="px-5 py-2 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-extrabold text-xs transition-colors">
              Cerrar

          </div>
        `;

        content.innerHTML = `

            <div class="flex items-center gap-2.5">
              <span class="px-2.5 py-1 rounded-lg bg-cyan-500/20 border border-cyan-400/50 text-cyan-200 font-mono text-xs font-extrabold">CC BY-NC-SA 4.0</span>
              <h3 class="text-lg font-extrabold text-white">Licencia Creative Commons</h3>
            </div>
            <button onclick="closeModal()" class="p-1.5 rounded-lg bg-slate-800/80 hover:bg-slate-700 text-cyan-200">
              <i data-lucide="x" class="w-4 h-4"></i>
            </button>
          </div>
          <div class="space-y-3 text-xs sm:text-sm text-cyan-100/90 leading-relaxed">
            <p class="font-bold text-white">Atribución - NoComercial - CompartirIgual 4.0 Internacional (CC BY-NC-SA 4.0)</p>
            <p>Usted es libre de <strong>compartir</strong> (copiar y redistribuir el material en cualquier medio o formato) y <strong>adaptar</strong> (remezclar, transformar y construir a partir del material) bajo los siguientes términos:</p>
            <ul class="space-y-1.5 pl-4 list-disc text-cyan-100/85">
              <li><strong>Atribución (BY):</strong> Debe dar crédito adecuado a los autores originales (Maria Alejandra Camacho Villa, Adrián de la Rosa y William Alarcón G.).</li>
              <li><strong>NoComercial (NC):</strong> No puede hacer uso del material con propósitos comerciales.</li>
              <li><strong>CompartirIgual (SA):</strong> Si remezcla o transforma el material, debe distribuir su contribución bajo la misma licencia.</li>
            </ul>
          </div>
          <div class="mt-5 flex justify-end">
            <button onclick="closeModal()" class="px-5 py-2 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-extrabold text-xs transition-colors">
              Entendido
            </button>
          </div>
        `;
      }

      modal.classList.remove("hidden");
      modal.classList.add("flex");
      if (window.lucide) lucide.createIcons();
    }

    function closeModal() {
      const modal = document.getElementById("info-modal");
      if (modal) {
        modal.classList.add("hidden");
        modal.classList.remove("flex");
      }
    }

    // =========================================================================
    // 0. DEFINICIÓN DE PERSONAJES Y RUTAS EN CARPETA img/ (Ale1, Car1, Adr1)
    // =========================================================================
    const CHARACTERS = {
      ale1: {
        id: "ale1",

        accentBorder: "border-sky-400/40",
        accentText: "text-sky-100",

        fallbackInitials: "CA",

    function renderCharacterImg(charKey, sizeClasses = "w-28 h-36 sm:w-36 sm:h-44", variantNum = 1) {
      const c = CHARACTERS[charKey];
      const imgSrc = `img/${c.prefix}${variantNum}.png`;

      return `
        <div class="relative z-10 shrink-0 flex items-end justify-center overflow-visible ${sizeClasses}">
          <img
            src="${imgSrc}"
            alt="${c.name} - ${c.role}"
            class="w-full h-full object-contain object-bottom character-cutout"
            onerror="if(!this.dataset.triedJpg){this.dataset.triedJpg='1'; this.src=this.src.replace('.png','.jpg');}else if(!this.dataset.triedBase && '${imgSrc}' !== '${defaultPng}'){this.dataset.triedBase='1'; this.dataset.triedJpg=''; this.src='${defaultPng}';}else{this.style.display='none'; this.nextElementSibling.style.display='flex';}"
          />
          <div style="display:none" class="w-24 h-24 rounded-2xl ${c.badgeBg} text-white font-extrabold text-xl items-center justify-center shadow-lg">
            ${c.fallbackInitials}
          </div>
        </div>

    // =========================================================================
    // 1. BANCO DE DATOS EXACTO DE LOS 3 MÓDULOS (15 PREGUNTAS)
    // =========================================================================
    const MODULES = [
      {

        subtitle: "Composición molecular, reacción enzimática y reservas inmediatas",

    const state = {

      results: {}          // Resultados validados { isCorrect: boolean }

    // =========================================================================
    // 3. UTILIDADES DE PROGRESO Y NAVEGACIÓN
    // =========================================================================
    function getTotalQuestions() {
      return MODULES.reduce((acc, m) => acc + m.questions.length, 0);
    }

    function getAnsweredCount() {
      return Object.keys(state.results).length;
    }

    function getCorrectCount() {
      return Object.values(state.results).filter(r => r.isCorrect).length;
    }

    function getNormalizedScore() {
      const totalQ = getTotalQuestions();
      if (!totalQ) return 0;
      return Math.round((getCorrectCount() / totalQ) * 100);
    }

    function getPointsPerQuestion() {
      const totalQ = getTotalQuestions();
      return totalQ ? (100 / totalQ).toFixed(1).replace('.0', '') : 0;
    }

    function getModuleStats(modIdx) {
      const mod = MODULES[modIdx];
      let answered = 0;
      let correct = 0;
      mod.questions.forEach(q => {
        if (state.results[q.id]) {
          answered++;
          if (state.results[q.id].isCorrect) correct++;
        }
      });
      return { total: mod.questions.length, answered, correct };
    }

    function goHome() {
      state.view = "home";
      state.selectedToken = null;
      render();
    }

    function selectModule(modIdx, qIdx = 0) {
      state.currentModuleIdx = modIdx;
      state.currentQuestionIdx = qIdx;
      state.view = "quiz";
      state.selectedToken = null;
      render();
    }

    function prevStep() {
      state.selectedToken = null;
      if (state.currentQuestionIdx > 0) {
        state.currentQuestionIdx--;
        render();
      } else {
        goHome();
      }
    }

    function nextStep() {
      state.selectedToken = null;
      const mod = MODULES[state.currentModuleIdx];
      if (state.currentQuestionIdx < mod.questions.length - 1) {
        state.currentQuestionIdx++;
        render();
      } else {
        state.view = "module_summary";
        render();
      }
    }

    function resetModule(modIdx) {
      const mod = MODULES[modIdx];
      mod.questions.forEach(q => {
        delete state.results[q.id];
        delete state.answers[q.id];
      });
      selectModule(modIdx, 0);
    }

    function resetAll() {
      state.answers = {};
      state.results = {};
      state.selectedToken = null;
      selectModule(0, 0);
    }

    function showToast(msg) {
      const existing = document.getElementById("custom-toast");
      if (existing) existing.remove();
      const toast = document.createElement("div");
      toast.id = "custom-toast";
      toast.className = "fixed bottom-5 left-1/2 -translate-x-1/2 z-50 bg-slate-900 text-white px-4 py-2.5 rounded-xl shadow-xl text-xs sm:text-sm font-semibold flex items-center gap-2 animate-enter";
      toast.innerHTML = `<i data-lucide="alert-circle" class="w-4 h-4 text-amber-400"></i><span>${msg}</span>`;
      document.body.appendChild(toast);
      if (window.lucide) lucide.createIcons();
      setTimeout(() => {
        if (toast.parentNode) toast.remove();
      }, 2800);
    }

    // =========================================================================
    // 4. ACTUALIZACIÓN DE BARRA SUPERIOR Y PESTAÑAS
    // =========================================================================
    function updateHeaderUI() {
      const totalQ = getTotalQuestions();
      const answered = getAnsweredCount();
      const score100 = getNormalizedScore();
      const pct = Math.round((answered / totalQ) * 100);

      const bar = document.getElementById("global-progress-bar");
      const text = document.getElementById("global-progress-text");
      const score = document.getElementById("global-score");

      if (bar) bar.style.width = `${pct}%`;
      if (text) text.textContent = `${answered}/${totalQ}`;
      if (score) score.textContent = `${score100} / 100`;

      MODULES.forEach((mod, idx) => {
        const btn = document.getElementById(`nav-mod-${idx}`);
        const badge = document.getElementById(`badge-mod-${idx}`);
        const stats = getModuleStats(idx);

        if (badge) {
        badge.textContent = `${stats.correct}/${stats.total}`;
        badge.className = stats.answered === stats.total && stats.total > 0
          ? "hidden sm:inline-block text-[11px] font-mono px-1.5 py-0.5 rounded bg-emerald-500/25 text-emerald-200 font-bold"
          : "hidden sm:inline-block text-[11px] font-mono px-1.5 py-0.5 rounded bg-slate-900/70 text-cyan-200";
      }

      if (btn) {
        const isActive = state.view !== "home" && state.currentModuleIdx === idx;
        btn.className = isActive
          ? "flex items-center justify-center sm:justify-between gap-1.5 px-3 py-2 rounded-xl text-xs font-bold transition-all border border-cyan-400 bg-cyan-500/25 text-white shadow-sm shadow-cyan-500/20"
          : "flex items-center justify-center sm:justify-between gap-1.5 px-3 py-2 rounded-xl text-xs font-semibold transition-all border border-cyan-500/20 bg-slate-900/60 text-cyan-100/80 hover:bg-slate-800/80 hover:text-white";
      }
    });
  }

  // =========================================================================
  // 5. RENDERIZADO PRINCIPAL Y VISTA DE INICIO (PROTAGONISMO Y SIN HUECOS)
  // =========================================================================
  function render() {
    updateHeaderUI();
    const container = document.getElementById("app-container");
    if (!container) return;

    if (state.view === "home") {
      container.innerHTML = renderHomeView();
    } else if (state.view === "quiz") {
      container.innerHTML = renderQuizView();
    } else if (state.view === "module_summary") {
      container.innerHTML = renderModuleSummaryView();
    } else if (state.view === "final_summary") {
      container.innerHTML = renderFinalSummaryView();
    }

    if (window.lucide) lucide.createIcons();
  }

  // --- VISTA DE PREGUNTA ACTIVA EN DOS COLUMNAS HORIZONTALES (ESTILO AZUL + PERSONAJE GRANDE) ---
  function renderQuizView() {
    const mod = MODULES[state.currentModuleIdx];
    const q = mod.questions[state.currentQuestionIdx];
    const submitted = state.results[q.id];
    const mentor = CHARACTERS[mod.characterKey];

    // Paginador de bolitas por pregunta dentro del módulo
    const dotsHTML = mod.questions.map((item, idx) => {
      const res = state.results[item.id];
      const isCurrent = idx === state.currentQuestionIdx;
      let classes = "w-8 h-8 rounded-lg text-xs font-extrabold font-mono flex items-center justify-center transition-all border ";
      if (isCurrent) {
        classes += "border-cyan-400 bg-cyan-500 text-slate-950 shadow-md scale-105";
      } else if (res) {
        classes += res.isCorrect
          ? "border-emerald-400/60 bg-emerald-500/25 text-emerald-200 hover:bg-emerald-500/35"
          : "border-rose-400/60 bg-rose-500/25 text-rose-200 hover:bg-rose-500/35";
      } else {
        classes += "border-cyan-500/25 bg-slate-900/70 text-cyan-200/80 hover:bg-slate-800";
      }
      return `<button onclick="selectModule(${state.currentModuleIdx}, ${idx})" class="${classes}" title="Pregunta ${idx + 1}">${idx + 1}</button>`;

    // Renderizar cuerpo según tipo de pregunta
    let questionBodyHTML = "";
    if (q.type === "atp_diagram") {
      questionBodyHTML = renderATPDiagramQuestion(q, submitted);
    } else if (q.type === "equation") {
      questionBodyHTML = renderEquationQuestion(q, submitted);
    } else if (q.type === "mcq") {
      questionBodyHTML = renderMCQQuestion(q, submitted);
    } else if (q.type === "matching") {
      questionBodyHTML = renderMatchingQuestion(q, submitted);
    } else if (q.type === "fill_blanks") {
      questionBodyHTML = renderFillBlanksQuestion(q, submitted);
    }

    // Retroalimentación pedagógica
    let feedbackHTML = "";
    if (submitted) {
      feedbackHTML = `
        <div class="mt-3 rounded-xl p-3.5 border ${submitted.isCorrect ? 'bg-emerald-50 border-emerald-400 text-emerald-950' : 'bg-rose-50 border-rose-400 text-rose-950'} animate-enter">
          <div class="flex items-start gap-2.5">
            <i data-lucide="${submitted.isCorrect ? 'check-circle-2' : 'alert-circle'}" class="w-5 h-5 shrink-0 mt-0.5 ${submitted.isCorrect ? 'text-emerald-600' : 'text-rose-600'}"></i>
            <div class="text-xs sm:text-sm leading-snug">
              <span class="font-extrabold block mb-0.5">
                ${submitted.isCorrect ? `¡Correcto! ${mentor.shortName} confirma tu acierto (+${getPointsPerQuestion()} pts)` : `${mentor.shortName} te sugiere revisar este concepto:`}
              </span>
              <span class="opacity-95">${q.explanation}</span>
            </div>
          </div>
        </div>

    return `

        <!-- Barra superior de control del módulo -->

              ${mod.code}: ${mod.title}
            </span>
            <span class="text-xs sm:text-sm text-cyan-100 font-semibold">Pregunta ${state.currentQuestionIdx + 1} de ${mod.questions.length}</span>

            ${dotsHTML}

        <!-- Layout Panorámico de 2 Columnas ocupando toda la altura disponible -->
        <div class="flex-1 min-h-0 grid grid-cols-1 lg:grid-cols-12 gap-3.5 items-stretch">
          <!-- COLUMNA IZQUIERDA (5 cols): Dedicada exclusivamente al personaje ampliado (+100 px) -->
          <div class="lg:col-span-5 blue-glass rounded-3xl p-4 sm:p-5 flex flex-col items-center justify-center text-center text-white overflow-visible">
            <div class="w-full h-full flex flex-col items-center justify-center text-center ${mentor.accentBg} border ${mentor.accentBorder} rounded-2xl p-3 sm:p-4 overflow-visible">
              ${renderCharacterImg(mod.characterKey, "w-[320px] h-[390px] sm:w-[360px] sm:h-[430px] lg:w-[390px] lg:h-[460px]", state.currentQuestionIdx + 1)}
              <div class="relative z-30 -mt-5 w-full flex flex-col items-center">
                <div class="inline-flex flex-wrap items-center justify-center gap-1.5 px-3.5 py-1 rounded-xl bg-slate-950/90 border border-white/25 shadow-xl mb-1.5 backdrop-blur-md">
                  <span class="px-2 py-0.5 rounded-md ${mentor.badgeBg} text-white text-xs font-extrabold uppercase tracking-wide">
                    ${mentor.shortName}
                  </span>
                  <span class="text-[11px] font-semibold text-white/90">${mentor.role}</span>
                </div>
                <p class="text-xs sm:text-sm ${mentor.accentText} leading-snug font-medium max-w-md">
                  “${q.characterTip}”

          <!-- COLUMNA DERECHA (7 cols): Enunciado arriba, Zona Interactiva, Retroalimentación y Controles -->
          <div class="lg:col-span-7 work-panel text-slate-800 rounded-3xl p-4 sm:p-5 flex flex-col justify-between overflow-hidden">
            <div class="overflow-y-auto pr-1 flex-1 flex flex-col justify-between gap-3">
              <!-- Enunciado e instrucciones arriba de las opciones de respuesta -->
              <div class="shrink-0 pb-2.5 border-b border-slate-200">
                <h2 class="text-sm sm:text-base lg:text-[17px] font-extrabold text-slate-900 leading-snug whitespace-pre-line">${q.prompt}</h2>
                ${q.instruction ? `
                  <p class="text-xs text-indigo-900 font-medium mt-2 flex items-start gap-2 bg-indigo-50/90 border border-indigo-200 rounded-xl px-3 py-2">
                    <i data-lucide="info" class="w-4 h-4 shrink-0 mt-0.5 text-indigo-600"></i>

              <!-- Área interactiva de opciones / diagramas -->

            <!-- Barra Inferior de Acción con botones más amplios -->
            <div class="mt-3 pt-3 border-t border-slate-200 flex items-center justify-between gap-3 shrink-0">
              <button onclick="prevStep()" class="px-4 py-2.5 rounded-xl border-2 border-slate-300 bg-white text-slate-700 hover:bg-slate-100 font-extrabold text-xs sm:text-sm flex items-center gap-2 transition-colors">
                <i data-lucide="arrow-left" class="w-4 h-4"></i>
                <span>${state.currentQuestionIdx === 0 ? 'Inicio' : 'Anterior'}</span>
              </button>

              <div class="flex items-center gap-2.5 ml-auto">
                ${!submitted ? `
                  <button onclick="validateCurrentQuestion()" class="px-6 py-2.5 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-extrabold text-xs sm:text-sm shadow-md transition-all flex items-center gap-2">
                    <i data-lucide="check" class="w-4 h-4"></i>
                    <span>Comprobar Respuesta</span>

                    <span>${isLastInModule ? 'Ver Resultados del Módulo' : 'Siguiente Pregunta'}</span>
                    <i data-lucide="arrow-right" class="w-4 h-4"></i>

              </div>
            </div>
          </div>

  // =========================================================================
  // 6. COMPONENTES INTERACTIVOS POR TIPO DE PREGUNTA
  // =========================================================================

    // --- 6.1 DIAGRAMA INTERACTIVO DEL ATP (M1 Q1) ---
    function getATPState(qId) {
      if (!state.answers[qId]) {
        state.answers[qId] = { adenina: null, ribosa: null, fosfatos: null };
      }
      return state.answers[qId];
    }

    function selectATPToken(val) {
      state.selectedToken = state.selectedToken === val ? null : val;
      render();
    }

    function assignATPTarget(qId, targetId) {
      if (state.results[qId]) return;
      const ans = getATPState(qId);

      if (state.selectedToken) {
        // Quitar el token si ya estaba en otro destino
        Object.keys(ans).forEach(k => {
          if (ans[k] === state.selectedToken) ans[k] = null;
        });
        ans[targetId] = state.selectedToken;
        state.selectedToken = null;
        render();
      } else if (ans[targetId]) {
        // Si toca un destino ocupado sin token seleccionado, lo libera
        ans[targetId] = null;
        render();
      } else {
        showToast("Primero selecciona una etiqueta de abajo o arrástrala aquí.");
      }
    }

    function handleATPDragStart(e, val) {
      e.dataTransfer.setData("text/plain", val);
    }

    function handleATPDrop(e, qId, targetId) {
      e.preventDefault();
      if (state.results[qId]) return;
      const val = e.dataTransfer.getData("text/plain");
      if (!val) return;
      const ans = getATPState(qId);
      Object.keys(ans).forEach(k => {
        if (ans[k] === val) ans[k] = null;
      });
      ans[targetId] = val;
      state.selectedToken = null;
      render();
    }

    function renderATPDiagramQuestion(q, submitted) {
      const ans = getATPState(q.id);
      const usedValues = Object.values(ans).filter(Boolean);

      const renderDropZone = (targetObj) => {
        const val = ans[targetObj.id];
        let borderClass = "border-dashed border-slate-300 bg-slate-50/80 text-slate-500 hover:border-indigo-400";
        if (submitted) {
          const isOk = val === targetObj.correct;
          borderClass = isOk
            ? "border-solid border-emerald-500 bg-emerald-50 text-emerald-900 font-bold"
            : "border-solid border-rose-500 bg-rose-50 text-rose-900 font-bold";
        } else if (val) {
          borderClass = "border-solid border-indigo-500 bg-indigo-50 text-indigo-900 font-bold shadow-xs";
        } else if (state.selectedToken) {
          borderClass = "border-dashed border-indigo-400 bg-indigo-50/40 text-indigo-700 animate-pulse";
        }

        return `
          <div
            onclick="assignATPTarget('${q.id}', '${targetObj.id}')"
            ondragover="event.preventDefault()"
            ondrop="handleATPDrop(event, '${q.id}', '${targetObj.id}')"
            class="cursor-pointer rounded-xl border-2 p-3 text-center transition-all min-h-[54px] flex flex-col items-center justify-center ${borderClass}"
          >
            <span class="text-[11px] uppercase tracking-wider opacity-70 block">${targetObj.label}</span>
            <span class="text-xs sm:text-sm mt-0.5">${val || "Toca o suelta aquí"}</span>
            ${submitted && val !== targetObj.correct ? `<span class="text-[11px] text-emerald-700 font-semibold mt-1">Correcto: ${targetObj.correct}</span>` : ""}
          </div>
        `;
      };

      const chipsHTML = q.options.map(opt => {
        const isUsed = usedValues.includes(opt);
        const isSelected = state.selectedToken === opt;
        return `
          <button
            type="button"
            draggable="${!submitted && !isUsed}"
            ondragstart="handleATPDragStart(event, '${opt}')"
            onclick="selectATPToken('${opt}')"
            ${submitted ? "disabled" : ""}
            class="no-select px-4 py-2.5 rounded-xl font-bold text-xs sm:text-sm border transition-all ${
              isSelected
                ? "bg-indigo-600 text-white border-indigo-600 chip-selected"
                : isUsed
                ? "bg-slate-100 text-slate-400 border-slate-200 opacity-60"
                : "bg-white text-slate-800 border-slate-300 hover:border-indigo-500 shadow-xs"
            }"
          >
            ${opt}
          </button>
        `;
      }).join("");

      return `
        <div class="space-y-3">
          <!-- Diagrama Vectorial Compacto de la Molécula de ATP -->
          <div class="bg-slate-50 border border-slate-200 rounded-xl p-3 flex flex-col items-center">
            <svg viewBox="0 0 640 215" class="w-full max-w-lg h-auto max-h-36" role="img" aria-label="Diagrama molecular del ATP">
              <!-- Enlace Adenina - Ribosa -->
              <line x1="175" y1="110" x2="225" y2="140" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" />
              <!-- Enlace Ribosa - Fosfato 1 -->
              <line x1="315" y1="140" x2="365" y2="140" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" />
              <!-- Enlaces de alta energía entre Fosfatos -->
              <line x1="425" y1="140" x2="465" y2="140" stroke="#ea580c" stroke-width="5" />
              <line x1="525" y1="140" x2="565" y2="140" stroke="#ea580c" stroke-width="5" />

              <!-- Grupo Adenina (Doble anillo morado) -->
              <g onclick="assignATPTarget('${q.id}', 'adenina')" class="cursor-pointer">
                <polygon points="75,40 125,25 165,60 150,110 95,110" fill="#8b5cf6" stroke="#5b21b6" stroke-width="3" />
                <polygon points="150,110 165,60 205,75 205,115 175,130" fill="#7c3aed" stroke="#5b21b6" stroke-width="3" />
                <text x="135" y="77" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">N / C</text>
                <text x="135" y="16" text-anchor="middle" fill="#5b21b6" font-size="12" font-weight="800">Base Nitrogenada</text>
              </g>

              <!-- Grupo Ribosa (Pentágono verde) -->
              <g onclick="assignATPTarget('${q.id}', 'ribosa')" class="cursor-pointer">
                <polygon points="270,95 320,127 302,183 238,183 220,127" fill="#22c55e" stroke="#15803d" stroke-width="3" />
                <text x="270" y="148" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">C₅H₁₀O₅</text>
                <text x="270" y="205" text-anchor="middle" fill="#15803d" font-size="12" font-weight="800">Azúcar Pentosa</text>
              </g>

              <!-- Tres Grupos Fosfato (Círculos naranjas) -->
              <g onclick="assignATPTarget('${q.id}', 'fosfatos')" class="cursor-pointer">
                <circle cx="395" cy="140" r="28" fill="#f97316" stroke="#c2410c" stroke-width="3" />
                <text x="395" y="146" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="900">P</text>

                <circle cx="495" cy="140" r="28" fill="#f97316" stroke="#c2410c" stroke-width="3" />
                <text x="495" y="146" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="900">P</text>

                <circle cx="595" cy="140" r="28" fill="#f97316" stroke="#c2410c" stroke-width="3" />
                <text x="595" y="146" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="900">P</text>

                <path d="M 368 181 Q 495 202 622 181" fill="none" stroke="#c2410c" stroke-width="2.5" />
                <text x="495" y="210" text-anchor="middle" fill="#c2410c" font-size="12" font-weight="800">Cadena Fosfato</text>
              </g>
            </svg>

            <!-- Zonas de destino debajo del diagrama -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-2 w-full mt-2">
              ${q.targets.map(t => renderDropZone(t)).join("")}
            </div>
          </div>

          <!-- Banco de Etiquetas -->
          <div class="flex flex-wrap items-center justify-center gap-2">
            ${chipsHTML}
          </div>
        </div>
      `;
    }

    // --- 6.2 ECUACIÓN DE HIDRÓLISIS DEL ATP (M1 Q2) ---
    function getEquationState(qId) {
      if (!state.answers[qId]) {
        state.answers[qId] = {
          reactant: null,
          enzyme: null,
          prod1: null,
          prod2: null,
          prod3: null,
          prod4: null
        };
      }
      return state.answers[qId];
    }

    function selectEqToken(val) {
      state.selectedToken = state.selectedToken === val ? null : val;
      render();
    }

    function assignEqSlot(qId, slotId) {
      if (state.results[qId]) return;
      const ans = getEquationState(qId);

      if (state.selectedToken) {
        Object.keys(ans).forEach(k => {
          if (ans[k] === state.selectedToken) ans[k] = null;
        });
        ans[slotId] = state.selectedToken;
        state.selectedToken = null;
        render();
      } else if (ans[slotId]) {
        ans[slotId] = null;
        render();
      } else {
        showToast("Selecciona una ficha del banco inferior para colocarla aquí.");
      }
    }

    function handleEqDrop(e, qId, slotId) {
      e.preventDefault();
      if (state.results[qId]) return;
      const val = e.dataTransfer.getData("text/plain");
      if (!val) return;
      const ans = getEquationState(qId);
      Object.keys(ans).forEach(k => {
        if (ans[k] === val) ans[k] = null;
      });
      ans[slotId] = val;
      state.selectedToken = null;
      render();
    }

    function renderEquationQuestion(q, submitted) {
      const ans = getEquationState(q.id);
      const usedValues = Object.values(ans).filter(Boolean);

      const renderSlotBox = (slotId, placeholder, isEnzyme = false) => {
        const val = ans[slotId];
        let style = "border-dashed border-slate-300 bg-white text-slate-400 hover:border-indigo-400";
        if (submitted) {
          let ok = false;
          if (slotId === "reactant") ok = val === q.correctReactant;
          else if (slotId === "enzyme") ok = val === q.correctEnzyme;
          else ok = q.correctProducts.includes(val);

          style = ok
            ? "border-solid border-emerald-500 bg-emerald-50 text-emerald-800 font-extrabold"
            : "border-solid border-rose-500 bg-rose-50 text-rose-800 font-extrabold";
        } else if (val) {
          style = "border-solid border-indigo-500 bg-indigo-50 text-indigo-900 font-extrabold shadow-xs";
        } else if (state.selectedToken) {
          style = "border-dashed border-indigo-400 bg-indigo-50/50 text-indigo-600";
        }

        return `
          <button
            type="button"
            onclick="assignEqSlot('${q.id}', '${slotId}')"
            ondragover="event.preventDefault()"
            ondrop="handleEqDrop(event, '${q.id}', '${slotId}')"
            class="${isEnzyme ? 'px-3 py-1.5 text-xs min-w-[96px]' : 'px-3.5 py-2.5 text-xs sm:text-sm min-w-[84px]'} rounded-xl border-2 font-mono transition-all ${style}"
          >
            ${val || placeholder}
          </button>
        `;
      };

      const bankHTML = q.bank.map(item => {
        const isUsed = usedValues.includes(item);
        const isSelected = state.selectedToken === item;
        return `
          <button
            type="button"
            draggable="${!submitted && !isUsed}"
            ondragstart="event.dataTransfer.setData('text/plain', '${item}')"
            onclick="selectEqToken('${item}')"
            ${submitted ? "disabled" : ""}
            class="no-select px-3.5 py-2 rounded-xl font-mono font-bold text-xs sm:text-sm border transition-all ${
              isSelected
                ? "bg-indigo-600 text-white border-indigo-600 chip-selected"
                : isUsed
                ? "bg-slate-100 text-slate-400 border-slate-200 opacity-55"
                : "bg-white text-slate-800 border-slate-300 hover:border-indigo-500 shadow-xs"
            }"
          >
            ${item}
          </button>
        `;
      }).join("");

      return `
        <div class="space-y-6">
          <div class="bg-slate-50 border border-slate-200 rounded-2xl p-4 sm:p-6">
            <div class="flex flex-wrap items-center justify-center gap-2 sm:gap-3">
              <!-- Reactivos -->
              <span class="px-3.5 py-2.5 rounded-xl bg-violet-100 border border-violet-300 text-violet-900 font-mono font-extrabold text-xs sm:text-sm">
                ATP
              </span>
              <span class="font-bold text-slate-500 text-lg">+</span>
              ${renderSlotBox("reactant", "Reactivo")}

              <!-- Flecha con Enzima -->
              <div class="flex flex-col items-center mx-1 sm:mx-2">
                <span class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1">Enzima</span>
                ${renderSlotBox("enzyme", "Enzima", true)}
                <div class="flex items-center text-slate-400 mt-1">
                  <div class="w-16 sm:w-20 h-0.5 bg-slate-400"></div>
                  <i data-lucide="chevron-right" class="w-4 h-4 -ml-1.5"></i>
                </div>
              </div>

              <!-- Productos -->
              <div class="flex flex-wrap items-center justify-center gap-2">
                ${renderSlotBox("prod1", "Prod. 1")}
                <span class="font-bold text-slate-500">+</span>
                ${renderSlotBox("prod2", "Prod. 2")}
                <span class="font-bold text-slate-500">+</span>
                ${renderSlotBox("prod3", "Prod. 3")}
                <span class="font-bold text-slate-500">+</span>
                ${renderSlotBox("prod4", "Prod. 4")}
              </div>
            </div>

            ${submitted ? `
              <div class="mt-4 pt-3 border-t border-slate-200 text-center text-xs font-mono font-bold text-emerald-700">
                Ecuación correcta: ATP + H2O —(ATPasa)→ ADP + Pi + H+ + Energía
              </div>
            ` : ""}
          </div>

          <!-- Banco de fichas -->
          <div class="flex flex-wrap items-center justify-center gap-2">
            ${bankHTML}
          </div>
        </div>
      `;
    }

    // --- 6.3 OPCIÓN MÚLTIPLE (MCQ) ---
    function selectMCQOption(qId, optIdx) {
      if (state.results[qId]) return;
      state.answers[qId] = optIdx;
      render();
    }

    function renderMCQQuestion(q, submitted) {
      const selectedIdx = state.answers[q.id];

      const optionsHTML = q.options.map((optText, idx) => {
        const isSelected = selectedIdx === idx;
        const isCorrect = q.correctIndex === idx;

        let cardClass = "border-slate-200 bg-white hover:border-indigo-400 hover:bg-indigo-50/30 text-slate-800";
        let badgeClass = "bg-slate-100 text-slate-600 border-slate-200";

        if (submitted) {
          if (isCorrect) {
            cardClass = "border-emerald-500 bg-emerald-50/80 text-emerald-950 font-semibold";
            badgeClass = "bg-emerald-600 text-white border-emerald-600";
          } else if (isSelected && !isCorrect) {
            cardClass = "border-rose-500 bg-rose-50/80 text-rose-950";
            badgeClass = "bg-rose-600 text-white border-rose-600";
          } else {
            cardClass = "border-slate-200 bg-slate-50/60 text-slate-400";
          }
        } else if (isSelected) {
          cardClass = "border-indigo-600 bg-indigo-50/70 text-indigo-950 font-semibold shadow-xs";
          badgeClass = "bg-indigo-600 text-white border-indigo-600";
        }

        const letter = String.fromCharCode(65 + idx);
        return `
          <button
            type="button"
            onclick="selectMCQOption('${q.id}', ${idx})"
            ${submitted ? "disabled" : ""}
            class="w-full text-left p-2.5 sm:p-3 rounded-xl border-2 transition-all flex items-start gap-2.5 ${cardClass}"
          >
            <span class="w-6 h-6 rounded-md border text-xs font-extrabold font-mono flex items-center justify-center shrink-0 mt-0.5 ${badgeClass}">
              ${letter}
            </span>
            <span class="text-xs sm:text-sm leading-snug flex-1">${optText}</span>
          </button>
        `;
      }).join("");

      return `<div class="space-y-2">${optionsHTML}</div>`;
    }

    // --- 6.4 EMPAREJAMIENTO DE COLUMNAS (MATCHING) ---
    function getMatchingState(qId) {
      if (!state.answers[qId]) {
        state.answers[qId] = { activeLeft: null, pairs: {} };
      }
      return state.answers[qId];
    }

    function selectMatchLeft(qId, leftId) {
      if (state.results[qId]) return;
      const ans = getMatchingState(qId);
      ans.activeLeft = ans.activeLeft === leftId ? null : leftId;
      render();
    }

    function selectMatchRight(qId, rightId) {
      if (state.results[qId]) return;
      const ans = getMatchingState(qId);
      if (!ans.activeLeft) {
        showToast("Primero selecciona un elemento de la Columna A.");
        return;
      }
      // Si el derecho ya estaba emparejado con otro, liberarlo
      Object.keys(ans.pairs).forEach(k => {
        if (ans.pairs[k] === rightId) delete ans.pairs[k];
      });
      ans.pairs[ans.activeLeft] = rightId;
      ans.activeLeft = null;
      render();
    }

    function renderMatchingQuestion(q, submitted) {
      const ans = getMatchingState(q.id);

      const leftHTML = q.colA.map(item => {
        const pairedRight = ans.pairs[item.id];
        const isActive = ans.activeLeft === item.id;
        let cls = "border-slate-200 bg-white text-slate-800 hover:border-indigo-400";

        if (submitted) {
          const ok = pairedRight === q.correctPairs[item.id];
          cls = ok
            ? "border-emerald-500 bg-emerald-50 text-emerald-950"
            : "border-rose-500 bg-rose-50 text-rose-950";
        } else if (isActive) {
          cls = "border-indigo-600 bg-indigo-50 text-indigo-950 ring-2 ring-indigo-300";
        } else if (pairedRight) {
          cls = "border-indigo-300 bg-indigo-50/40 text-slate-900";
        }

        return `
          <button
            type="button"
            onclick="selectMatchLeft('${q.id}', '${item.id}')"
            ${submitted ? "disabled" : ""}
            class="w-full text-left p-2.5 rounded-xl border-2 transition-all flex items-center justify-between gap-2 ${cls}"
          >
            <span class="text-xs font-medium leading-snug">${item.text}</span>
            <span class="shrink-0 px-2 py-0.5 rounded-md text-[11px] font-mono font-extrabold ${
              pairedRight ? "bg-indigo-600 text-white" : "bg-slate-100 text-slate-500"
            }">
              ${pairedRight || "?"}
            </span>
          </button>
        `;
      }).join("");

      const rightHTML = q.colB.map(item => {
        const linkedLeftId = Object.keys(ans.pairs).find(k => ans.pairs[k] === item.id);
        let cls = "border-slate-200 bg-white text-slate-800 hover:border-indigo-400";

        if (submitted) {
          const expectedLeft = Object.keys(q.correctPairs).find(k => q.correctPairs[k] === item.id);
          const ok = linkedLeftId === expectedLeft;
          cls = ok
            ? "border-emerald-500 bg-emerald-50 text-emerald-950"
            : "border-rose-500 bg-rose-50 text-rose-950";
        } else if (ans.activeLeft) {
          cls = "border-dashed border-indigo-400 bg-indigo-50/30 text-slate-900 hover:bg-indigo-50";
        } else if (linkedLeftId) {
          cls = "border-indigo-300 bg-indigo-50/40 text-slate-900";
        }

        return `
          <button
            type="button"
            onclick="selectMatchRight('${q.id}', '${item.id}')"
            ${submitted ? "disabled" : ""}
            class="w-full text-left p-2.5 rounded-xl border-2 transition-all flex items-center justify-between gap-2 ${cls}"
          >
            <span class="text-xs font-medium leading-snug">${item.text}</span>
            ${linkedLeftId ? `<span class="shrink-0 px-1.5 py-0.5 rounded bg-slate-800 text-white text-[10px] font-mono font-bold">#${linkedLeftId}</span>` : ""}
          </button>
        `;
      }).join("");

      return `
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div class="space-y-2">
            <span class="text-[11px] font-extrabold uppercase tracking-wider text-slate-500 block">Columna A (Concepto)</span>
            ${leftHTML}
          </div>
          <div class="space-y-2">
            <span class="text-[11px] font-extrabold uppercase tracking-wider text-slate-500 block">Columna B (Correspondencia)</span>
            ${rightHTML}
          </div>
        </div>
      `;
    }

    // --- 6.5 COMPLETAR ESPACIOS EN BLANCO (FILL BLANKS) ---
    function getFillBlanksState(qId) {
      if (!state.answers[qId]) {
        state.answers[qId] = {};
      }
      return state.answers[qId];
    }

    function selectBlankToken(val) {
      state.selectedToken = state.selectedToken === val ? null : val;
      render();
    }

    function assignBlankSlot(qId, blankId) {
      if (state.results[qId]) return;
      const ans = getFillBlanksState(qId);

      if (state.selectedToken) {
        Object.keys(ans).forEach(k => {
          if (ans[k] === state.selectedToken) delete ans[k];
        });
        ans[blankId] = state.selectedToken;
        state.selectedToken = null;
        render();
      } else if (ans[blankId]) {
        delete ans[blankId];
        render();
      } else {
        showToast("Selecciona una palabra del banco inferior para ubicarla aquí.");
      }
    }

    function handleBlankDrop(e, qId, blankId) {
      e.preventDefault();
      if (state.results[qId]) return;
      const val = e.dataTransfer.getData("text/plain");
      if (!val) return;
      const ans = getFillBlanksState(qId);
      Object.keys(ans).forEach(k => {
        if (ans[k] === val) delete ans[k];
      });
      ans[blankId] = val;
      state.selectedToken = null;
      render();
    }

    function renderFillBlanksQuestion(q, submitted) {
      const ans = getFillBlanksState(q.id);
      const usedWords = Object.values(ans);

      const paragraphHTML = q.segments.map(seg => {
        if (typeof seg === "string") {
          return `<span>${seg}</span>`;
        }
        const val = ans[seg.id];
        let cls = "border-dashed border-indigo-400 bg-indigo-50/50 text-indigo-700";
        if (submitted) {
          const ok = val === seg.answer;
          cls = ok
            ? "border-solid border-emerald-500 bg-emerald-100 text-emerald-900 font-bold"
            : "border-solid border-rose-500 bg-rose-100 text-rose-900 font-bold";
        } else if (val) {
          cls = "border-solid border-indigo-600 bg-indigo-600 text-white font-bold shadow-xs";
        }

        return `
          <button
            type="button"
            onclick="assignBlankSlot('${q.id}', '${seg.id}')"
            ondragover="event.preventDefault()"
            ondrop="handleBlankDrop(event, '${q.id}', '${seg.id}')"
            class="inline-flex items-center justify-center px-3 py-1 mx-1 my-0.5 rounded-lg border-2 text-xs sm:text-sm font-mono transition-all min-w-[105px] ${cls}"
          >
            ${val || `[${seg.label}]`}
          </button>
        `;
      }).join("");

      const bankHTML = q.bank.map(word => {
        const isUsed = usedWords.includes(word);
        const isSelected = state.selectedToken === word;
        return `
          <button
            type="button"
            draggable="${!submitted && !isUsed}"
            ondragstart="event.dataTransfer.setData('text/plain', '${word}')"
            onclick="selectBlankToken('${word}')"
            ${submitted ? "disabled" : ""}
            class="no-select px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold border transition-all ${
              isSelected
                ? "bg-indigo-600 text-white border-indigo-600 chip-selected"
                : isUsed
                ? "bg-slate-100 text-slate-400 border-slate-200 opacity-55"
                : "bg-white text-slate-800 border-slate-300 hover:border-indigo-500 shadow-xs"
            }"
          >
            ${word}
          </button>
        `;
      }).join("");

      return `
        <div class="space-y-6">
          <div class="bg-slate-50 border border-slate-200 rounded-2xl p-5 sm:p-7 text-sm sm:text-base text-slate-800 leading-loose">
            ${paragraphHTML}
          </div>
          <div class="flex flex-wrap items-center justify-center gap-2">
            ${bankHTML}
          </div>
        </div>
      `;
    }

    // =========================================================================
    // 7. VALIDACIÓN DE RESPUESTAS
    // =========================================================================
    function validateCurrentQuestion() {
      const mod = MODULES[state.currentModuleIdx];
      const q = mod.questions[state.currentQuestionIdx];
      let isCorrect = false;

      if (q.type === "atp_diagram") {
        const ans = getATPState(q.id);
        if (!ans.adenina || !ans.ribosa || !ans.fosfatos) {
          showToast("Completa las 3 partes del diagrama antes de comprobar.");
          return;
        }
        isCorrect = q.targets.every(t => ans[t.id] === t.correct);
      } else if (q.type === "equation") {
        const ans = getEquationState(q.id);
        const slots = ["reactant", "enzyme", "prod1", "prod2", "prod3", "prod4"];
        if (slots.some(s => !ans[s])) {
          showToast("Completa todos los espacios de la reacción química.");
          return;
        }
        const userProds = [ans.prod1, ans.prod2, ans.prod3, ans.prod4].sort();
        const expectedProds = [...q.correctProducts].sort();
        const prodsMatch = userProds.every((val, i) => val === expectedProds[i]);
        isCorrect = ans.reactant === q.correctReactant && ans.enzyme === q.correctEnzyme && prodsMatch;
      } else if (q.type === "mcq") {
        const chosen = state.answers[q.id];
        if (chosen === undefined || chosen === null) {
          showToast("Selecciona una opción antes de comprobar.");
          return;
        }
        isCorrect = chosen === q.correctIndex;
      } else if (q.type === "matching") {
        const ans = getMatchingState(q.id);
        if (Object.keys(ans.pairs).length < q.colA.length) {
          showToast("Empareja todos los elementos de la Columna A con la Columna B.");
          return;
        }
        isCorrect = q.colA.every(item => ans.pairs[item.id] === q.correctPairs[item.id]);
      } else if (q.type === "fill_blanks") {
        const ans = getFillBlanksState(q.id);
        const blanks = q.segments.filter(s => typeof s === "object");
        if (blanks.some(b => !ans[b.id])) {
          showToast("Completa todos los espacios en blanco del párrafo.");
          return;
        }
        isCorrect = blanks.every(b => ans[b.id] === b.answer);
      }

      state.results[q.id] = { isCorrect };
      state.selectedToken = null;
      if (isCorrect) {
        soundEngine.playSuccess();
      } else {
        soundEngine.playError();
      }
      render();
    }

    // =========================================================================
    // 9. VISTAS DE RESUMEN DE MÓDULO Y REPORTE FINAL
    // =========================================================================
    function renderModuleSummaryView() {
      const mod = MODULES[state.currentModuleIdx];
      const stats = getModuleStats(state.currentModuleIdx);
      const pct = Math.round((stats.correct / stats.total) * 100);
      const isLastModule = state.currentModuleIdx === MODULES.length - 1;
      const mentor = CHARACTERS[mod.characterKey];

      const breakdownHTML = mod.questions.map((q, idx) => {
        const res = state.results[q.id];
        const ok = res && res.isCorrect;
        return `
          <div class="flex items-center justify-between p-3 rounded-xl border ${ok ? 'border-emerald-300 bg-emerald-50/90' : 'border-rose-300 bg-rose-50/90'}">
            <div class="flex items-center gap-3 min-w-0">
              <span class="w-7 h-7 rounded-lg font-mono text-xs font-extrabold flex items-center justify-center shrink-0 ${ok ? 'bg-emerald-600 text-white' : 'bg-rose-600 text-white'}">
                ${idx + 1}
              </span>
              <p class="text-xs sm:text-sm font-semibold text-slate-800 truncate">${q.prompt.split('\n')[0]}</p>
            </div>
            <button onclick="selectModule(${state.currentModuleIdx}, ${idx})" class="ml-2 shrink-0 px-3 py-1 rounded-lg bg-white border border-slate-300 text-xs font-bold text-indigo-700 hover:bg-indigo-50">
              Revisar
            </button>
          </div>
        `;
      }).join("");

      return `
        <div class="animate-enter flex-1 min-h-0 w-full blue-glass text-white rounded-3xl p-5 sm:p-7 flex flex-col justify-center">
          <div class="grid grid-cols-1 md:grid-cols-12 gap-6 items-center h-full">
            <div class="md:col-span-5 flex flex-col items-center text-center border-b md:border-b-0 md:border-r border-cyan-400/25 pb-4 md:pb-0 md:pr-6">
              ${renderCharacterImg(mod.characterKey, "w-36 h-48 sm:w-44 sm:h-56")}
              <span class="text-xs font-extrabold uppercase tracking-wider text-cyan-300 mt-2">${mod.code} COMPLETADO • ${mentor.shortName}</span>
              <h2 class="text-2xl sm:text-3xl font-extrabold text-white mt-1 mb-1.5">${mod.title}</h2>
              <p class="text-sm text-cyan-100/90 mb-5">
                Obtuviste <strong class="text-amber-300">${stats.correct} de ${stats.total}</strong> aciertos (${pct}%).
              </p>
              <div class="flex flex-wrap items-center justify-center gap-3 w-full">
                <button onclick="resetModule(${state.currentModuleIdx})" class="px-4 py-2.5 rounded-xl border border-cyan-300/40 bg-slate-900/70 hover:bg-slate-800 text-cyan-100 font-bold text-xs sm:text-sm flex items-center gap-2 transition-colors">
                  <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                  <span>Reintentar</span>
                </button>
                ${!isLastModule ? `
                  <button onclick="selectModule(${state.currentModuleIdx + 1}, 0)" class="px-5 py-2.5 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-slate-950 font-extrabold text-xs sm:text-sm shadow-lg flex items-center gap-2 transition-colors">
                    <span>Ir al ${MODULES[state.currentModuleIdx + 1].code}</span>
                    <i data-lucide="arrow-right" class="w-4 h-4"></i>
                  </button>
                ` : `
                  <button onclick="state.view='final_summary'; render();" class="px-5 py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-extrabold text-xs sm:text-sm shadow-lg flex items-center gap-2 transition-colors">
                    <i data-lucide="trophy" class="w-4 h-4"></i>
                    <span>Reporte Final</span>
                  </button>
                `}
              </div>
            </div>
            <div class="md:col-span-7 work-panel text-slate-800 rounded-2xl p-4 sm:p-5 space-y-2.5 max-h-[62vh] overflow-y-auto">
              ${breakdownHTML}
            </div>
          </div>
        </div>
      `;
    }

    function renderFinalSummaryView() {
      const totalQ = getTotalQuestions();
      const totalCorrect = getCorrectCount();
      const totalPct = getNormalizedScore();

      let levelTitle = "En Entrenamiento Metabólico";
      if (totalPct >= 90) levelTitle = "¡Excelente Dominio en Fisiología del Ejercicio!";
      else if (totalPct >= 70) levelTitle = "¡Muy Buen Desempeño Fisiológico!";
      else if (totalPct >= 50) levelTitle = "Buen Progreso — Sigue Reforzando";

      const moduleCards = MODULES.map((mod, idx) => {
        const st = getModuleStats(idx);
        const modPct = Math.round((st.correct / st.total) * 100);
        const mentor = CHARACTERS[mod.characterKey];
        return `
          <div class="p-3.5 rounded-2xl border border-slate-200 bg-slate-50 flex items-center justify-between gap-3">
            <div class="flex items-center gap-3 min-w-0">
              ${renderCharacterImg(mod.characterKey, "w-14 h-18")}
              <div class="min-w-0">
                <span class="text-xs font-extrabold text-indigo-700 uppercase">${mod.code} • ${mentor.shortName}</span>
                <h4 class="font-extrabold text-sm sm:text-base text-slate-900 truncate">${mod.title}</h4>
                <p class="text-xs text-slate-600">${st.correct} de ${st.total} aciertos (${modPct}%)</p>
              </div>
            </div>
            <button onclick="selectModule(${idx}, 0)" class="shrink-0 px-3.5 py-2 rounded-xl bg-white border border-slate-300 hover:border-indigo-500 text-xs font-bold text-slate-700">
              Revisar
            </button>
          </div>
        `;
      }).join("");

      return `
        <div class="animate-enter flex-1 min-h-0 w-full blue-glass text-white rounded-3xl p-5 sm:p-7 flex flex-col justify-center">
          <div class="grid grid-cols-1 md:grid-cols-12 gap-6 items-center h-full">
            <div class="md:col-span-5 flex flex-col items-center text-center border-b md:border-b-0 md:border-r border-cyan-400/25 pb-4 md:pb-0 md:pr-6">
              <div class="flex items-end justify-center gap-2 mb-2">
                ${renderCharacterImg("ale1", "w-24 h-32")}
                ${renderCharacterImg("adr1", "w-28 h-36")}
                ${renderCharacterImg("car1", "w-24 h-32")}
              </div>
              <span class="px-3 py-1 rounded-full bg-cyan-500/20 text-cyan-200 border border-cyan-400/40 text-xs font-extrabold uppercase tracking-wider">
                FISIOLOGÍA DEL EJERCICIO
              </span>
              <h2 class="text-xl sm:text-2xl font-extrabold text-white mt-2 mb-1.5">${levelTitle}</h2>
              <p class="text-cyan-100/90 text-xs sm:text-sm mb-5">
                Lograste <strong>${totalCorrect} de ${totalQ}</strong> aciertos totales (<strong class="text-amber-300">${totalPct} / 100 puntos</strong>).
              </p>
              <div class="flex flex-wrap items-center justify-center gap-3 w-full">
                <button onclick="resetAll()" class="px-5 py-2.5 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-slate-950 font-extrabold text-xs sm:text-sm shadow-lg flex items-center gap-2 transition-colors">
                  <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                  <span>Reiniciar Todo</span>
                </button>
                <button onclick="goHome()" class="px-5 py-2.5 rounded-xl border border-cyan-300/40 bg-slate-900/70 hover:bg-slate-800 text-cyan-100 font-bold text-xs sm:text-sm transition-colors">
                  Inicio
                </button>
              </div>
            </div>
            <div class="md:col-span-7 work-panel text-slate-800 rounded-2xl p-4 sm:p-5 space-y-3">
              ${moduleCards}
            </div>
          </div>
        </div>
      `;
    }

    // Inicializar al cargar
    window.addEventListener("DOMContentLoaded", () => {
      render();
    });
  </script>
</body>
</html>
